name: Deploy Backend to InfinityFree

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy PHP Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Path on your InfinityFree server (e.g., htdocs or htdocs/api)
          server-dir: htdocs/
          # Exclude runtime upload folders or local configuration files if needed
          exclude: |
            **/.git*
            **/.git*/**
            **/vendor/**
            **/uploads/**
